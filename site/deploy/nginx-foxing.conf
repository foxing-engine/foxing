# foxing.dev — the engine's site, served from the current release.
# HTTP only here; `certbot --nginx` adds the 443 blocks and the redirect (see setup-server.sh
# and add-foxing.sh). foxingengine.com and moondial.ai (the engine's old name) redirect here.

server {
    listen 80;
    listen [::]:80;
    server_name www.foxing.dev foxingengine.com www.foxingengine.com;
    return 301 https://foxing.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name foxing.dev;
    include snippets/analytics.conf;

    root /srv/agentscanplay/current/sites/foxing;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/foxing.access.log;
    error_log  /var/log/nginx/foxing.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~* \.md$   { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* \.txt$  { types { } default_type "text/plain; charset=utf-8"; }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
