# disremembered.com — the door for people. The same files as agentscanplay.com, with
# the root sent to the play page: a person who types the game's name lands in the game.
# (agentscanplay.com stays the door for agents: its root answers with the invitation.)
# HTTP only here; `certbot --nginx` adds the 443 blocks and the redirect (see
# add-disremembered.sh). The play page calls play.agentscanplay.com, which must allow
# this origin: the driver's FOXING_CORS_ORIGINS default names it.

server {
    listen 80;
    listen [::]:80;
    server_name www.disremembered.com;
    return 301 https://disremembered.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name disremembered.com;
    include snippets/analytics.conf;

    root /srv/agentscanplay/current/sites/agentscanplay;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/disremembered.access.log;
    error_log  /var/log/nginx/disremembered.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The front door is the game. A 302, so the address can be given something of its
    # own later without browsers remembering this.
    location = / { return 302 /play/; }

    location ~* \.md$   { types { } default_type "text/markdown; charset=utf-8"; }
    location ~* \.ya?ml$ { types { } default_type "text/yaml; charset=utf-8"; }
    location ~* \.py$   { types { } default_type "text/plain; charset=utf-8"; }
    location ~* \.txt$  { types { } default_type "text/plain; charset=utf-8"; }

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ^~ /play/mods/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
