# moondial.ai — the engine's name until 2026-11-01. Everything redirects to foxing.dev.
# The certificate for moondial.ai is in the agentscanplay.com lineage (one certificate was
# issued for all four names at setup, filed under the first); it stays in use here, so
# old https links land on the redirect rather than a certificate error.

server {
    listen 80;
    listen [::]:80;
    server_name moondial.ai www.moondial.ai;
    return 301 https://foxing.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moondial.ai www.moondial.ai;
    ssl_certificate /etc/letsencrypt/live/agentscanplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentscanplay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://foxing.dev$request_uri;
}
