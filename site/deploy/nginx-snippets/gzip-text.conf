# Compression for the site's text (Y6, 11-13). Lives in /etc/nginx/conf.d/ on the site
# box. Ubuntu's nginx.conf already says `gzip on;` and compresses HTML only; this
# adds the types the site serves. Do not add `gzip on;` here: a second one is a
# duplicate directive and nginx will not start.
gzip_types text/plain text/css text/markdown text/yaml text/javascript application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
