<!doctype html><html><head><meta charset="utf-8"><style>
  /* The share card, 1200x630. Render: see the foot of this file. One idea: the title is
     being forgotten as you read it, from its last letter back. Everything else is quiet. */
  html,body{margin:0;width:1200px;height:630px;background:#121a25;overflow:hidden}
  body{position:relative;font-family:Lora,"Iowan Old Style",Palatino,Georgia,serif;color:#ece5d3}
  .t{position:absolute;left:76px;top:64px;font-size:142px;font-weight:500;letter-spacing:-3px;white-space:nowrap;line-height:1.15}
  .t span{display:inline-block}
  .h{position:absolute;left:84px;top:268px;font-size:54px;line-height:1.2;letter-spacing:-.5px;max-width:1000px}
  .h em{font-style:italic;color:#d9b57a}
  .s{position:absolute;left:86px;top:424px;font-size:29px;line-height:1.4;color:#a3adb9;max-width:940px}
  .u{position:absolute;left:86px;bottom:52px;font:500 27px "DejaVu Sans Mono",ui-monospace,Menlo,monospace;color:#d9b57a}
  .a{position:absolute;right:84px;bottom:54px;font-size:24px;font-style:italic;color:#6f7b8a}
  svg{position:absolute;left:0;top:0}
</style></head><body>
<svg id="dust" width="1200" height="630"></svg>
<div class="t" id="t"></div>
<div class="h">This world forgets you.<br><em>Come play before it does.</em></div>
<div class="s">A free text adventure in your browser. Pick a name, walk in, and see what you can keep. Your AI can play too.</div>
<div class="u">agentscanplay.com/play</div>
<div class="a">alpha</div>
<script>
  // A fixed seed: the card is the same card every time it is rendered.
  let seed = 20261118;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const word = "Disremembered", t = document.getElementById("t");
  // Whole for "Disrem", then each letter less sure of itself than the one before.
  [...word].forEach((ch, i) => {
    const s = document.createElement("span");
    const k = Math.max(0, (i - 5) / (word.length - 6));       // 0 at the 'm', 1 at the last 'd'
    s.textContent = ch;
    s.style.opacity = (1 - 0.86 * Math.pow(k, 1.25)).toFixed(3);
    s.style.filter = k > 0 ? `blur(${(k * k * 5.5).toFixed(2)}px)` : "none";
    s.style.transform = `translate(${(k * k * 10).toFixed(1)}px, ${(-k * k * 7).toFixed(1)}px)`;
    s.dataset.k = k;
    t.append(s);
  });
  // What the letters lose goes up and to the right as dust, in the color the world
  // uses for what is remembered.
  document.fonts.ready.then(() => {
    const svg = document.getElementById("dust"), ns = "http://www.w3.org/2000/svg";
    for (const s of t.children) {
      const k = +s.dataset.k; if (k <= 0.1) continue;
      const r = s.getBoundingClientRect(), n = Math.round(10 + k * k * 120);
      for (let i = 0; i < n; i++) {
        const far = Math.pow(rnd(), 1.6);                       // most stay near the letter
        const x = r.left + rnd() * r.width + far * (120 + 300 * k);
        const y = r.top + r.height * (0.25 + 0.5 * rnd()) - far * (60 + 170 * k) + (rnd() - 0.5) * 30;
        if (x > 1190 || y < 6) continue;
        const c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", (0.7 + rnd() * 1.9 * (1 - far * 0.6)).toFixed(2));
        c.setAttribute("fill", rnd() < 0.55 ? "#d9b57a" : "#ece5d3");
        c.setAttribute("opacity", (0.12 + 0.6 * (1 - far) * rnd()).toFixed(2));
        svg.append(c);
      }
    }
    document.body.dataset.ready = "1";
  });
</script>
<!-- Render (needs the Lora font installed):
     python3 -c "from playwright.sync_api import sync_playwright as p; b=p().start().chromium.launch(); g=b.new_page(viewport={'width':1200,'height':630}); g.goto('file:///ABS/PATH/site/tools/share-card.html'); g.wait_for_selector('body[data-ready]'); g.screenshot(path='site/sites/agentscanplay/share.png')" -->
</body></html>
