name: Notify Discord

# Posts the outcome of every deploy (Disremembered game server and the
# agentscanplay.com / foxing.dev site) to a Discord channel.
# Needs the DISCORD_WEBHOOK secret; without it this workflow does nothing.

on:
  workflow_run:
    workflows:
      - "Deploy driver (play.agentscanplay.com)"
      - "Deploy site (agentscanplay.com, foxing.dev)"
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::DISCORD_WEBHOOK secret is not set; skipping"
            exit 0
          fi

          case "$WORKFLOW" in
            "Deploy driver"*) target="Disremembered · play.agentscanplay.com" ;;
            "Deploy site"*)   target="Foxing site · agentscanplay.com, foxing.dev" ;;
            *)                target="$WORKFLOW" ;;
          esac

          case "$CONCLUSION" in
            success)   icon="🟢"; color=3066993;  word="deployed" ;;
            failure)   icon="🔴"; color=15158332; word="deploy failed" ;;
            cancelled) icon="⚪"; color=9807270;  word="deploy cancelled" ;;
            *)         icon="🟡"; color=15844367; word="deploy $CONCLUSION" ;;
          esac

          subject=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          short=${SHA::7}

          # A failed driver deploy is one of two things: the old world still up, or
          # no world at all. On 11-15 it was the second for 21 minutes and this said
          # only "deploy failed". Ask the world itself, and say which in the title.
          content=""
          if [ "$CONCLUSION" != success ] && case "$WORKFLOW" in "Deploy driver"*) true;; *) false;; esac; then
            up=no
            for _ in 1 2 3 4 5 6; do
              if curl -fsS --max-time 10 https://play.agentscanplay.com/health 2>/dev/null | grep -q '"ok":true'; then up=yes; break; fi
              sleep 10
            done
            if [ "$up" = yes ]; then
              word="$word; the world is up (on the build before, or this one after all)"
            else
              icon="🚨"; word="$word and THE WORLD IS DOWN: /health has not answered for a minute"
              content="@here Disremembered is down after a failed deploy. journalctl -u foxing on moondial-1."
            fi
          fi

          jq -n \
            --arg title "$icon $target — $word" \
            --arg url "$RUN_URL" \
            --arg desc "[\`$short\`]($REPO_URL/commit/$SHA) $subject" \
            --arg footer "$TRIGGER by $ACTOR" \
            --argjson color "$color" \
            --arg content "$content" \
            '{username: "Foxing deploys", content: $content,
              embeds: [{title: $title, url: $url, description: $desc,
                        color: $color, footer: {text: $footer}}]}' \
          | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
