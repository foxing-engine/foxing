# play.agentscanplay.com — the Disremembered driver's HTTP port, behind nginx.
# HTTP only here; `certbot --nginx` adds the 443 block and the redirect (see setup-server.sh).
# The raw text port (7778) is not proxied; it is the driver's own listener, and nothing
# logs it. setup-analytics.sh adds `include snippets/analytics.conf;` to this block, which
# writes the JSON access log and serves the admin page at /_admin/.
#
# R11: the driver is listed twice, so a connection refused during a restart is tried
# once more a moment later (nginx retries a refused connection even for a POST, since
# nothing was sent; a request it did send is never retried). With socket activation
# (enable-socket-activation.sh) the kernel holds the connection open across the
# restart instead, and this is the net under it.
upstream foxing_driver {
    server 127.0.0.1:7777 max_fails=0;
    server 127.0.0.1:7777 max_fails=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.agentscanplay.com;

    access_log /var/log/nginx/play.access.log;
    error_log  /var/log/nginx/play.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://foxing_driver;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error;
        proxy_next_upstream_tries 2;
    }

    # The session: a WebSocket, held open for hours; the client pings every 30 s.
    location /v0/session {
        proxy_pass http://foxing_driver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
