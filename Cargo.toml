[workspace]
resolver = "2"
members = [
    "crates/foxing-time",
    "crates/foxing-log",
    "crates/foxing-log-postgres",
    "crates/foxing-store",
    "crates/foxing-registry",
    "crates/foxing-query",
    "crates/foxing-clear",
    "crates/foxing-clear-wasm",
    "crates/foxing-driver",
    "crates/foxing",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/foxing-engine/foxing"
homepage = "https://foxing.dev"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["json", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.6", features = ["cors"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

# The checker for the browser: small over fast.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
